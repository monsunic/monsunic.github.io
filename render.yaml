services:
  # ===========================================
  # 🟦 BACKEND (Rust + Actix)
  # ===========================================
  - type: web
    name: monsun-api
    env: rust
    rootDir: backend
    buildCommand: cargo build --release
    startCommand: ./target/release/monsun-backend
    plan: free
    autoDeploy: true
    envVars:
      - key: RUST_LOG
        value: info
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # ===========================================
  # 🟩 FRONTEND (Vue + Vite)
  # ===========================================
  - type: web
    name: monsun
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://monsun-api.onrender.com
